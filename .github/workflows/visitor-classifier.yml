name: Visitor classifier

on:
  push:
    paths:
      - "cloudflare/visitor-logger/**"
      - ".github/workflows/visitor-classifier.yml"
  pull_request:
    paths:
      - "cloudflare/visitor-logger/**"
      - ".github/workflows/visitor-classifier.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/visitor-logger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/visitor-logger/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
